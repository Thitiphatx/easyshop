services:
  mysql-db:
    image: mysql:8.4
    container_name: mysql_server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 2n9R7RsnMwvwRWhZ
      MYSQL_DATABASE: easyshop
      MYSQL_USER: easyshop
      MYSQL_PASSWORD: user_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: